[project]
name = "sigmazerosearch"
version = "0.1.0"
description = ""
authors = [{ name = "Niam Patel", email = "naz1997@googlemail.com" }]
requires-python = "~=3.10"
readme = "README.md"
dependencies = [
    "matplotlib>=3.8.2,<4",
    "pandas>=2.1.4,<3",
    "numpy>=1.26.3,<2",
    "scipy>=1.11.4,<2",
    "uproot>=5.2.1,<6",
    "mplhep>=0.3.31,<0.4",
    "awkward-pandas>=2023.8.0,<2024",
    "awkward>=2.5.2,<3",
    "vector>=1.3.1,<2",
    "tabulate>=0.9.0,<0.10",
    "hist>=2.7.3,<3",
    "pytest-benchmark>=5.1.0,<6",
    "particle>=0.25.4",
    "pyqt6>=6.9.1",
]

[dependency-groups]
dev = [
    "ipython>=8.21.0,<9",
    "pre-commit>=3.7.0,<4",
    "ruff>=0.4.2,<0.5",
    "jupyterlab>=4.2.0,<5",
    "filprofiler>=2024.11.2,<2025",
]
test = ["pytest>=8.0.0,<9"]
docs = [
    "Sphinx==8.0.2",
    "furo>=2024.8.6,<2025",
    "myst-parser>=4.0.0,<5",
    "sphinx-autodoc2>=0.5.0,<0.6",
    "sphinx-autobuild>=2024.4.16,<2025",
    "sphinx-design>=0.6.1,<0.7",
]

[tool.uv]
default-groups = [
    "dev",
    "test",
    "docs",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff.lint]
extend-select = [
    "I", # isort
]
